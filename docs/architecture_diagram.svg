<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1360" viewBox="0 0 1100 1360" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <!--
    Cardiometabolic Digital Twin — System Architecture
    Alignment contract:
      - Canvas center axis x = 550
      - Every layer box is 760 wide, centered: x = 170, right edge = 930
      - Boxes are 150 tall, stacked with a 56px vertical gap
      - Vertical connectors are a single straight line on x = 550
      - Arrowheads centered on x = 550
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#334155"/>
    </marker>
    <linearGradient id="gTitle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <style>
      .box { stroke-width:2; rx:14; }
      .ltitle { font-size:21px; font-weight:700; fill:#0f172a; }
      .lnum { font-size:15px; font-weight:700; fill:#ffffff; }
      .ldesc { font-size:14.5px; fill:#334155; }
      .conn { stroke:#334155; stroke-width:2.4; }
    </style>
  </defs>

  <!-- Title band -->
  <rect x="170" y="24" width="760" height="78" rx="14" fill="url(#gTitle)"/>
  <text x="550" y="60" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">Cardiometabolic Digital Twin</text>
  <text x="550" y="86" text-anchor="middle" font-size="14.5" fill="#94a3b8">Predictive Glycemic Excursion &amp; Counterfactual Intervention System for Type 2 Diabetes</text>

  <!-- ============ LAYER 1 ============ y=146 -->
  <rect class="box" x="170" y="146" width="760" height="150" rx="14" fill="#eff6ff" stroke="#3b82f6"/>
  <rect x="170" y="146" width="150" height="150" rx="14" fill="#3b82f6"/>
  <rect x="306" y="146" width="14" height="150" fill="#3b82f6"/>
  <text x="245" y="228" text-anchor="middle" class="lnum" font-size="40">1</text>
  <text x="245" y="256" text-anchor="middle" class="lnum" font-size="12">LAYER</text>
  <text x="344" y="186" class="ltitle">Data Generation</text>
  <text x="344" y="216" class="ldesc">Synthetic Synthea-style EHR cohort — 300 T2DM patients, 19 fields</text>
  <text x="344" y="240" class="ldesc">Bergman Minimal Model ODE + Dalla Man gut absorption kinetics</text>
  <text x="344" y="264" class="ldesc">300 × 14-day wearable streams @ 5-min (CGM, HR, HRV, steps, sleep)</text>

  <!-- connector 1->2 -->
  <line class="conn" x1="550" y1="296" x2="550" y2="346" marker-end="url(#arrow)"/>

  <!-- ============ LAYER 2 ============ y=352 -->
  <rect class="box" x="170" y="352" width="760" height="150" rx="14" fill="#f0fdfa" stroke="#14b8a6"/>
  <rect x="170" y="352" width="150" height="150" rx="14" fill="#14b8a6"/>
  <rect x="306" y="352" width="14" height="150" fill="#14b8a6"/>
  <text x="245" y="434" text-anchor="middle" class="lnum" font-size="40">2</text>
  <text x="245" y="462" text-anchor="middle" class="lnum" font-size="12">LAYER</text>
  <text x="344" y="392" class="ltitle">Feature Pipeline</text>
  <text x="344" y="422" class="ldesc">4-hour sliding window (48 readings), stepped every 30 min</text>
  <text x="344" y="446" class="ldesc">47 features = 18 static EHR + 29 dynamic wearable signals</text>
  <text x="344" y="470" class="ldesc">Patient-level split — 198,000 samples, zero data leakage</text>

  <!-- connector 2->3 -->
  <line class="conn" x1="550" y1="502" x2="550" y2="552" marker-end="url(#arrow)"/>

  <!-- ============ LAYER 3 ============ y=558 -->
  <rect class="box" x="170" y="558" width="760" height="150" rx="14" fill="#fef2f2" stroke="#ef4444"/>
  <rect x="170" y="558" width="150" height="150" rx="14" fill="#ef4444"/>
  <rect x="306" y="558" width="14" height="150" fill="#ef4444"/>
  <text x="245" y="640" text-anchor="middle" class="lnum" font-size="40">3</text>
  <text x="245" y="668" text-anchor="middle" class="lnum" font-size="12">LAYER</text>
  <text x="344" y="598" class="ltitle">Machine Learning &amp; Explainability</text>
  <text x="344" y="628" class="ldesc">Fused XGBoost regressor — 2-hour glucose forecast (R² = 0.805)</text>
  <text x="344" y="652" class="ldesc">Class-weighted adverse-event classifier (AUROC = 0.976)</text>
  <text x="344" y="676" class="ldesc">SHAP TreeExplainer — per-prediction clinical attributions</text>

  <!-- connector 3->4 -->
  <line class="conn" x1="550" y1="708" x2="550" y2="758" marker-end="url(#arrow)"/>

  <!-- ============ LAYER 4 ============ y=764 -->
  <rect class="box" x="170" y="764" width="760" height="150" rx="14" fill="#fffbeb" stroke="#f59e0b"/>
  <rect x="170" y="764" width="150" height="150" rx="14" fill="#f59e0b"/>
  <rect x="306" y="764" width="14" height="150" fill="#f59e0b"/>
  <text x="245" y="846" text-anchor="middle" class="lnum" font-size="40">4</text>
  <text x="245" y="874" text-anchor="middle" class="lnum" font-size="12">LAYER</text>
  <text x="344" y="804" class="ltitle">Digital Twin Engine</text>
  <text x="344" y="834" class="ldesc">Stateful per-patient twin initialized from the EHR profile</text>
  <text x="344" y="858" class="ldesc">predict() — 2h forecast, risk level, top-5 SHAP factors</text>
  <text x="344" y="882" class="ldesc">simulate() — deterministic Bergman ODE What-If counterfactuals</text>

  <!-- connector 4->5 -->
  <line class="conn" x1="550" y1="914" x2="550" y2="964" marker-end="url(#arrow)"/>

  <!-- ============ LAYER 5 ============ y=970 -->
  <rect class="box" x="170" y="970" width="760" height="150" rx="14" fill="#faf5ff" stroke="#8b5cf6"/>
  <rect x="170" y="970" width="150" height="150" rx="14" fill="#8b5cf6"/>
  <rect x="306" y="970" width="14" height="150" fill="#8b5cf6"/>
  <text x="245" y="1052" text-anchor="middle" class="lnum" font-size="40">5</text>
  <text x="245" y="1080" text-anchor="middle" class="lnum" font-size="12">LAYER</text>
  <text x="344" y="1010" class="ltitle">FastAPI REST Backend</text>
  <text x="344" y="1040" class="ldesc">Async API with per-patient twin caching, served on port 8000</text>
  <text x="344" y="1064" class="ldesc">/patients · /patient/{id} · /state · /timeline · /predict · /simulate</text>
  <text x="344" y="1088" class="ldesc">Serves the dashboard and OpenAPI (Swagger) documentation</text>

  <!-- connector 5->6 -->
  <line class="conn" x1="550" y1="1120" x2="550" y2="1170" marker-end="url(#arrow)"/>

  <!-- ============ LAYER 6 ============ y=1176 -->
  <rect class="box" x="170" y="1176" width="760" height="150" rx="14" fill="#f8fafc" stroke="#0ea5e9"/>
  <rect x="170" y="1176" width="150" height="150" rx="14" fill="#0ea5e9"/>
  <rect x="306" y="1176" width="14" height="150" fill="#0ea5e9"/>
  <text x="245" y="1258" text-anchor="middle" class="lnum" font-size="40">6</text>
  <text x="245" y="1286" text-anchor="middle" class="lnum" font-size="12">LAYER</text>
  <text x="344" y="1216" class="ltitle">Clinician Dashboard</text>
  <text x="344" y="1246" class="ldesc">Patient 360° profile · SVG 2-hour adverse-risk gauge</text>
  <text x="344" y="1270" class="ldesc">Dual-axis CGM / heart-rate timeline with 2h forecast overlay</text>
  <text x="344" y="1294" class="ldesc">SHAP attribution bars · What-If intervention simulator (live refresh)</text>
</svg>
